<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0f">
<title>Poker Live Trackers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap">
<style>
/* Home: one banner per tracked series, running first, then past. Dark, like the trackers. */
:root {
  --bg: #0c0c0f; --card: #141418; --line: #26262c; --fg: #fafafa; --fg2: #d4d4d8; --muted: #a1a1aa; --dim: #7c7c86;
  --gold: #e3b45f; --live: #2dd4bf; --live-soft: rgba(45, 212, 191, .16);
  --sans: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --head: 'Oswald', 'Arial Narrow', 'Inter', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
body { padding: env(safe-area-inset-top, 0px) 0 calc(32px + env(safe-area-inset-bottom, 0px)); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1000px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
header { padding: 22px 0 6px; }
header h1 { margin: 0; font: 700 34px/1.05 var(--head); letter-spacing: .01em; }
header p { margin: 6px 0 0; color: var(--muted); font-size: 13.5px; }
h2 { font: 600 21px/1.1 var(--head); margin: 24px 0 10px; letter-spacing: .01em; }
.empty { color: var(--dim); font-size: 14px; background: var(--card); border-radius: 14px; padding: 22px 16px; text-align: center; }

/* Banner card: a short strip. Name top-left, status top-right, dates and a line of numbers at the bottom. */
.banners { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.past { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); }
.past .empty, .banners .empty { grid-column: 1 / -1; }
.banner { position: relative; display: flex; flex-direction: column; justify-content: flex-end; min-height: 112px; border-radius: 12px; overflow: hidden;
  background: var(--card); isolation: isolate; transition: transform .2s ease; }
.past .banner { min-height: 90px; border-radius: 10px; }
.banner:hover { transform: translateY(-2px); }
@media (prefers-reduced-motion: reduce) { .banner { transition: none; } .banner:hover { transform: none; } .badge .dot { animation: none !important; } }
.art { position: absolute; inset: 0; overflow: hidden; }
.art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0, 0, 0, .6) 0%, rgba(0, 0, 0, .25) 65%, rgba(0, 0, 0, .1) 100%); }
.mark { position: absolute; z-index: 1; left: 16px; top: 13px; right: 96px; line-height: 1; }
.mark b { display: block; font: 700 24px/1 var(--head); letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mark i { display: block; font: 600 10.5px/1 var(--sans); font-style: normal; letter-spacing: .18em; text-transform: uppercase; margin-top: 6px; color: rgba(255, 255, 255, .7); }
.past .mark { left: 14px; top: 11px; }
.past .mark b { font-size: 19px; }
.past .mark i { font-size: 10px; margin-top: 5px; }
.watermark { position: absolute; right: -1%; bottom: -14%; font: 700 96px/1 var(--head); opacity: .07; letter-spacing: -.02em; pointer-events: none; }
.past .watermark { font-size: 76px; }
.info { position: relative; z-index: 2; padding: 56px 16px 12px; }
.past .info { padding: 46px 14px 10px; }
.title { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } /* the name is in the art; kept for screen readers */
.dates { color: var(--gold); font-size: 13px; font-weight: 500; }
.past .dates { font-size: 12px; }
.chips, .go { display: none; }
.badge { position: absolute; z-index: 2; top: 11px; right: 11px; display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 9px;
  font: 600 10.5px/1.4 var(--sans); letter-spacing: .06em; text-transform: uppercase; background: rgba(0, 0, 0, .5); backdrop-filter: blur(6px); color: var(--fg); }
.past .badge { display: none; } /* the section says they're finished */
.badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--live); animation: pulse 2s infinite; }
.badge.done .dot { background: var(--dim); animation: none; }
.badge.soon .dot { background: var(--gold); animation: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(45, 212, 191, .6); } 70% { box-shadow: 0 0 0 6px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.stats { display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 4px; font-size: 12px; color: rgba(255, 255, 255, .72); }
.past .stats { font-size: 11.5px; gap: 2px 10px; margin-top: 3px; }
.stats b { color: var(--fg); font-weight: 600; }
.stats .gold { color: var(--gold); }

/* Series art: drawn here, in each organiser's colours */
.art.apt { background:
    radial-gradient(60% 70% at 72% 18%, rgba(255, 196, 120, .45), transparent 60%),
    radial-gradient(70% 80% at 20% 90%, rgba(220, 38, 38, .55), transparent 60%),
    linear-gradient(160deg, #1b2440 0%, #2a1f3a 45%, #4a1c1c 100%); }
.art.apt .mark b { color: #f3c77a; text-shadow: 0 1px 3px rgba(0, 0, 0, .5); }
.art.apt .skyline { position: absolute; inset: auto 0 0 0; height: 55%; opacity: .45; }
.art.glpc { background:
    radial-gradient(70% 90% at 50% 0%, rgba(242, 200, 120, .55), transparent 60%),
    radial-gradient(60% 60% at 85% 85%, rgba(156, 111, 30, .6), transparent 60%),
    linear-gradient(180deg, #3b2a12 0%, #1c140a 100%); }
.art.glpc .mark b { color: #ffe3a8; text-shadow: 0 1px 3px rgba(0, 0, 0, .5); }
.art.glpc .rays { position: absolute; inset: -40%; background: repeating-conic-gradient(from 0deg at 50% 30%, rgba(255, 227, 168, .07) 0 6deg, transparent 6deg 18deg); }
.art.triton { background:
    radial-gradient(55% 80% at 50% 40%, rgba(214, 178, 106, .28), transparent 65%),
    linear-gradient(180deg, #0d1018 0%, #05060a 100%); }
.art.triton .mark b { color: #e7cf98; text-shadow: 0 1px 3px rgba(0, 0, 0, .5); }
.art.tone { background:
    radial-gradient(60% 90% at 85% 30%, rgba(60, 90, 255, .35), transparent 60%),
    linear-gradient(120deg, #06104a 0%, #0b1d7a 55%, #07114f 100%); }
.art.tone .mark b { color: #f0c46a; text-shadow: 0 1px 3px rgba(0, 0, 0, .5); }
.art.tone .swoosh { position: absolute; right: -8%; top: -60%; width: 45%; height: 220%; border-radius: 50%; border: 14px solid rgba(255, 255, 255, .05); }
.art.all { background:
    radial-gradient(70% 90% at 20% 20%, rgba(214, 178, 106, .35), transparent 60%),
    radial-gradient(60% 80% at 90% 90%, rgba(60, 90, 255, .25), transparent 60%),
    linear-gradient(160deg, #10131c 0%, #05060a 100%); }
.art.all .mark b { color: #e7cf98; }
.art.triton .lines { position: absolute; inset: 0; background:
    linear-gradient(90deg, transparent 49.6%, rgba(214, 178, 106, .35) 50%, transparent 50.4%),
    repeating-linear-gradient(115deg, rgba(214, 178, 106, .08) 0 1px, transparent 1px 28px); mask-image: radial-gradient(60% 80% at 50% 45%, #000, transparent); -webkit-mask-image: radial-gradient(60% 80% at 50% 45%, #000, transparent); }
footer { margin-top: 30px; color: var(--dim); font-size: 12.5px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Series</h1>
    <p>Live bust and re-entry trackers. Tap a series to follow it.</p>
  </header>
  <section aria-labelledby="h-live"><h2 id="h-live">Running now</h2><div class="banners" id="live"></div></section>
  <section aria-labelledby="h-alltime" id="alltime-wrap" hidden><h2 id="h-alltime">All-time</h2><div class="banners" id="alltime"></div></section>
  <section aria-labelledby="h-soon" id="soon-wrap" hidden><h2 id="h-soon">Coming up</h2><div class="banners" id="soon"></div></section>
  <section aria-labelledby="h-past"><h2 id="h-past">Past</h2><div class="past" id="past"></div></section>
  <footer>Data from each organiser's public live pages, saved by pollers on GitHub. Not affiliated with the organisers.</footer>
</div>

<script>
(function () {
  'use strict';
  // One entry per tracker. start/end: series dates in the venue's time zone (inclusive).
  const SERIES = [
    { id: 'apt', path: 'apt/', branch: 'data', title: 'APT Championship, Taipei 2026', mark: 'APT Taipei', sub: 'Championship · 2026', art: 'apt', watermark: '2026',
      start: '2026-11-12', end: '2026-11-29', tz: 'Asia/Taipei', currency: 'TWD' },
    { id: 'triton', path: 'triton/', branch: 'triton-data', title: 'Triton, Northern Cyprus 2026', mark: 'Triton', sub: 'Northern Cyprus · 2026', art: 'triton', watermark: 'TRITON',
      start: '2026-11-15', end: '2026-11-30', tz: 'Europe/Athens', currency: 'USD' },
    { id: 'glpc', path: 'glpc/', branch: 'glpc-data', title: 'Grand Loyal Poker Championships VI', mark: 'GLPC VI', sub: 'Grand Loyal · Vietnam', art: 'glpc', watermark: 'VI',
      start: '2026-11-18', end: '2026-11-29', tz: 'Asia/Ho_Chi_Minh', currency: 'VND' },
  ];

  // Where the trackers' saved summaries live: ?repo=owner/name, else derived from <owner>.github.io/<repo>/
  function repoSlug() {
    const q = new URLSearchParams(location.search).get('repo');
    if (q && /^[\w.-]+\/[\w.-]+$/.test(q)) return q;
    const m = location.hostname.match(/^([\w-]+)\.github\.io$/);
    const seg = location.pathname.split('/').filter(Boolean)[0];
    return m && seg ? `${m[1]}/${seg}` : null;
  }
  const REPO = repoSlug();

  const $ = (s) => document.querySelector(s);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const nf = new Intl.NumberFormat('en-US');
  const short = (v) => { const a = Math.abs(v); if (a >= 1e9) return (a / 1e9).toFixed(a >= 1e10 ? 1 : 2).replace(/\.?0+$/, '') + 'B'; if (a >= 1e6) return (a / 1e6).toFixed(a >= 1e7 ? 1 : 2).replace(/\.?0+$/, '') + 'M'; if (a >= 1e3) return Math.round(a / 1e3) + 'K'; return String(Math.round(a)); };
  const ago = (t) => { const s = Math.max(0, Math.round(Date.now() / 1000 - t)); return s < 90 ? 'just now' : s < 3600 ? Math.round(s / 60) + ' min ago' : s < 86400 ? Math.round(s / 3600) + ' h ago' : Math.round(s / 86400) + ' d ago'; };
  const fMon = new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' });
  const ymd = (tz) => { try { return new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()); } catch { return new Date().toISOString().slice(0, 10); } };
  const asDate = (s) => new Date(s + 'T00:00:00Z');
  const days = (a, b) => Math.round((asDate(b) - asDate(a)) / 86400000) + 1;
  const status = (s) => { const today = ymd(s.tz); return today < s.start ? 'soon' : today > s.end ? 'past' : 'live'; };
  const calIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"/></svg>';

  function art(s) {
    const a = el('div', 'art ' + s.art);
    if (s.art === 'apt') a.insertAdjacentHTML('beforeend', '<svg class="skyline" viewBox="0 0 400 120" preserveAspectRatio="none" aria-hidden="true"><path fill="#0b0d16" d="M0 120V70h18v-22h14v30h12V40h16v38h10V58h20v62h8V30l8-8 8 8v90h10V64h14V20h6V6l3-6 3 6v14h6v100h10V52h18v68h12V36h20v84h10V62h16v58h14V44h12v76h18V58h22v62h20V74h12v46z"/></svg>');
    if (s.art === 'glpc') a.appendChild(el('div', 'rays'));
    if (s.art === 'triton' || s.art === 'all') a.appendChild(el('div', 'lines'));
    if (s.art === 'tone') a.appendChild(el('div', 'swoosh'));
    a.appendChild(el('div', 'watermark', s.watermark));
    const m = el('div', 'mark'); m.appendChild(el('b', '', s.mark)); m.appendChild(el('i', '', s.sub)); a.appendChild(m);
    return a;
  }

  function banner(s, meta) {
    const st = s.fixed || status(s);
    const card = el('a', 'banner'); card.href = s.path;
    card.setAttribute('aria-label', `${s.title}, ${fMon.format(asDate(s.start))} to ${fMon.format(asDate(s.end))}`);
    card.appendChild(art(s));
    const running = meta && meta.running;
    const b = el('span', 'badge ' + (st === 'live' ? '' : st === 'soon' ? 'soon' : 'done'));
    b.appendChild(el('span', 'dot'));
    b.append(s.badge || (st === 'past' ? 'Finished' : st === 'soon' ? 'Coming up' : running ? `Live · ${running} running` : 'Live'));
    card.appendChild(b);
    card.appendChild(el('span', 'go', 'Open tracker →'));
    const info = el('div', 'info');
    info.appendChild(el('h3', 'title', s.title));
    info.appendChild(el('div', 'dates', s.datesText || `${fMon.format(asDate(s.start))} to ${fMon.format(asDate(s.end))}`));
    const chips = el('div', 'chips');
    const c = el('span', 'chip'); c.innerHTML = calIcon; c.appendChild(el('b', '', String(days(s.start, s.end)))); c.appendChild(el('small', '', 'days')); chips.appendChild(c);
    info.appendChild(chips);
    if (meta) {
      const stats = el('div', 'stats');
      const add = (v, label, cls) => { const sp = el('span'); sp.appendChild(el('b', cls || '', v)); sp.append(' ' + label); stats.appendChild(sp); };
      if (meta.festivals) add(nf.format(meta.festivals), 'festivals');
      if (meta.finished) add(nf.format(meta.finished), s.archived ? (meta.finished === 1 ? 'event' : 'events') : meta.finished === 1 ? 'event finished' : 'events finished');
      if (meta.players) add(nf.format(meta.players), 'players');
      if (meta.bullets) add(nf.format(meta.bullets), 'bullets');
      if (meta.paid) add(`${({ USD: '$', EUR: '€', GBP: '£', HKD: 'HK$', TWD: 'NT$', VND: '₫', THB: '฿' })[s.currency] || s.currency + ' '}${short(meta.paid)}`, 'paid out', 'gold');
      if (meta.updatedAt && st === 'live') { const sp = el('span'); sp.append('updated '); sp.appendChild(el('b', '', ago(meta.updatedAt))); stats.appendChild(sp); }
      if (stats.childNodes.length) info.appendChild(stats);
    }
    card.appendChild(info);
    return card;
  }

  const metas = {};
  // Past Triton festivals, saved by tools/triton-archive.js (newest first), shown under Past
  let tritonPast = [], allTime = null;
  async function loadTriton() {
    try {
      const idx = await (await fetch('triton/archive/index.json', { cache: 'no-cache' })).json();
      tritonPast = (idx.festivals || []).map((f) => {
        const yr = f.start.slice(0, 4);
        const s = { id: 'tr-' + f.id, path: `triton/?f=${f.id}`, title: f.name.replace(/^(\d{4}) (.*)$/, '$2 $1').replace(/Triton SHR Series /, 'Triton '),
          mark: f.place, sub: (f.one ? 'Triton One' : 'Triton') + ' · ' + yr, art: f.one ? 'tone' : 'triton', watermark: yr,
          start: f.start, end: f.end, tz: f.tz || 'UTC', currency: f.currency || 'USD', fixed: 'past', archived: true };
        metas[s.id] = { finished: f.events, players: f.players, paid: f.paid, note: f.bullets === 'all' ? 'bullets on record' : f.bullets === 'some' ? 'some bullets on record' : '' };
        return s;
      });
      const usd = (idx.festivals || []).reduce((a, f) => a + (f.paid || 0) * (f.usd || 1), 0);
      const first = (idx.festivals || []).map((f) => f.start).sort()[0];
      allTime = { id: 'tr-all', path: 'triton/?view=all', title: 'Triton, every festival', mark: 'Triton', sub: 'Every festival', art: 'all', watermark: 'ALL',
        start: first, end: new Date().toISOString().slice(0, 10), tz: 'UTC', currency: 'USD', fixed: 'live', badge: 'All-time', archived: true,
        datesText: first ? `${new Date(first + 'T00:00:00Z').toLocaleDateString('en-GB', { month: 'short', year: 'numeric', timeZone: 'UTC' })} to now` : '' };
      metas['tr-all'] = { festivals: (idx.festivals || []).length + 1, finished: (idx.festivals || []).reduce((a, f) => a + f.events, 0), paid: usd };
    } catch {}
    render();
  }
  function render() {
    const groups = { live: [], soon: [], past: [] };
    for (const s of SERIES) groups[status(s)].push(s);
    groups.past.push(...tritonPast);
    groups.live.sort((a, b) => (b.start < a.start ? -1 : 1));
    groups.soon.sort((a, b) => (a.start < b.start ? -1 : 1));
    groups.past.sort((a, b) => (b.end < a.end ? -1 : 1));
    const fill = (id, list, empty) => {
      const box = $('#' + id); box.replaceChildren();
      if (!list.length && empty) { box.appendChild(el('div', 'empty', empty)); return; }
      for (const s of list) box.appendChild(banner(s, metas[s.id]));
    };
    fill('live', groups.live, 'No series is running right now.');
    $('#soon-wrap').hidden = !groups.soon.length; fill('soon', groups.soon);
    fill('past', groups.past, 'Series appear here once they end.');
    $('#alltime-wrap').hidden = !allTime; if (allTime) fill('alltime', [allTime]);
  }

  async function load() {
    if (!REPO) return;
    await Promise.all(SERIES.map(async (s) => {
      try {
        const r = await fetch(`https://raw.githubusercontent.com/${REPO}/${s.branch}/meta.json`, { cache: 'no-cache' });
        if (r.ok) metas[s.id] = await r.json();
      } catch {}
    }));
    render();
  }
  render();
  load();
  loadTriton();
  setInterval(load, 5 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
})();
</script>
</body>
</html>
