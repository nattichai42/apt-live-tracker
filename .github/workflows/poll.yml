name: Poll series
run-name: ${{ inputs.rehearse && format('Rehearse archiving {0}', inputs.series) || inputs.series && format('Poll {0}', inputs.series) || 'Start pollers' }}

# One workflow for every series in docs/series.js.
# - Every 15 minutes (and when run by hand with no series) it starts a poller for each series in its dates.
# - Run with a series id, it polls that series for 5 h 45 min, saving to the series' data branch, and queues its own
#   next run first. A run waits in its series' concurrency group and starts the moment the previous one ends, so
#   polling continues even when GitHub delays or skips the schedule; the scheduled start is only the fallback.
# - Once a series is over (docs/series.js: over), its last run polls briefly for late payouts, saves the series in its
#   organiser's archive (docs/<org>/archive/) and commits that to main; the schedule then leaves it alone.
# - Run by hand with a series id and "rehearse", it archives the series as it stands now and pushes that to a scratch
#   branch it deletes again: no polling, nothing queued, main and the site untouched. Its own concurrency group, so
#   it never displaces the series' queued poller.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      series:
        description: Series id from docs/series.js (leave empty to start every series in its dates)
        required: false
        default: ''
      rehearse:
        description: Rehearse the end-of-series archive for that series (no polling; main stays as it is)
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write   # lets a run start or queue runs of this workflow
  pages: write     # asks for a site build after committing an archive

concurrency:
  group: poll-${{ inputs.series || 'start' }}${{ inputs.rehearse && '-rehearse' || '' }}
  cancel-in-progress: false

jobs:
  start:
    if: ${{ !inputs.series }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Start a poller for each series in its dates
        # A series already polling gets a run queued behind the current one (its group keeps at most one waiting)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for id in $(node poller/ctl.js active); do
            gh workflow run poll.yml --ref main -f series="$id" && echo "queued $id" || echo "::warning::could not queue $id"
          done

  poll:
    if: ${{ inputs.series }}
    runs-on: ubuntu-latest
    timeout-minutes: 358   # GitHub's hard cap is 360
    env:
      SERIES: ${{ inputs.series }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore state from the series' data branch
        run: |
          BRANCH=$(node poller/ctl.js branch "$SERIES")
          mkdir -p state
          if git fetch --depth=1 origin "$BRANCH" 2>/dev/null; then
            git show "origin/$BRANCH:state.json" > state/state.json && echo "restored $(wc -c < state/state.json) bytes from $BRANCH"
          else
            echo "no previous state on $BRANCH, starting fresh"
          fi
      - name: Queue the next run
        if: ${{ !inputs.rehearse }}
        id: next
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if node poller/ctl.js over "$SERIES" state/state.json; then
            echo "over=true" >> "$GITHUB_OUTPUT"
            echo "Not queueing another run."
          else
            gh workflow run poll.yml --ref main -f series="$SERIES" && echo "Queued the next run." || echo "::warning::Could not queue the next run; the schedule is the fallback."
          fi
      - name: Poll for 5 h 45 min (20 min when the series is over)
        if: ${{ !inputs.rehearse }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINUTES: ${{ steps.next.outputs.over == 'true' && '20' || '345' }}
        run: node poller/poll.js --series "$SERIES" --state state/state.json --minutes "$MINUTES"
      - name: Archive the finished series
        if: ${{ steps.next.outputs.over == 'true' || inputs.rehearse }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: poller/archive.sh "$SERIES" state/state.json ${{ inputs.rehearse && '--rehearse' || '' }}
