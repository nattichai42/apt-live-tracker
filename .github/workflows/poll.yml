name: Poll APT live seating

on:
  schedule:
    - cron: '*/15 * * * *'   # backup trigger: a queued run waits in the concurrency group and starts as soon as the running job ends
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # lets a run queue the next run of this workflow

concurrency:
  group: apt-poller
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 358   # GitHub's hard cap is 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore state from the data branch
        run: |
          mkdir -p state
          if git fetch --depth=1 origin data 2>/dev/null; then
            git show origin/data:state.json > state/state.json && echo "restored $(wc -c < state/state.json) bytes"
          else
            echo "no previous state, starting fresh"
          fi
      - name: Queue the next run
        # Each run queues its successor, which waits in the concurrency group and starts the moment this one
        # ends, so polling continues even when GitHub delays or skips the cron schedule. Stops once the series is over.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f state/state.json ] && node -e 'const s=require("./state/state.json"); const ev=Object.values(s.events||{}); process.exit(ev.length && ev.every(e=>e.phase==="Completed") ? 0 : 1)'; then
            echo "Every event is completed; not queueing another run."
          else
            gh workflow run poll.yml --ref main && echo "Queued the next run." || echo "::warning::Could not queue the next run; the cron schedule is the fallback."
          fi
      - name: Poll for 5 h 45 min
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node poller/poll.js --state state/state.json --minutes 345 --min-interval 10 --max-interval 60 --budget 1 --publish-every 3
